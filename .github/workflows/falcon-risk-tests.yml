name: FALCON Risk Tests
on:
  push:
    branches: [scorpio-ng-2.0]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Compile research modules and regression tests
        run: npx tsc --strict --skipLibCheck --target ES2020 --module commonjs --outDir /tmp/falcon-risk lib/risk-gate.ts lib/risk-research.ts lib/daily-range.ts tests/risk-gate.test.ts tests/daily-range.test.ts tests/risk-research.test.ts lib/falcon-brain.ts tests/falcon-brain.test.ts
      - run: node /tmp/falcon-risk/tests/risk-gate.test.js
      - run: node /tmp/falcon-risk/tests/daily-range.test.js
      - run: node /tmp/falcon-risk/tests/risk-research.test.js
      - run: node /tmp/falcon-risk/tests/falcon-brain.test.js
      - name: Full application type check
        run: npx tsc --noEmit
      - name: Production build check
        run: npm run build
