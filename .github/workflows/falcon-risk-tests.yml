name: FALCON Risk Tests
on:
  push:
    branches: [scorpio-ng-2.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx tsc --strict --skipLibCheck --target ES2020 --module commonjs --outDir /tmp/falcon-risk lib/risk-gate.ts tests/risk-gate.test.ts
      - run: node /tmp/falcon-risk/tests/risk-gate.test.js
