name: FALCON Historical Import Tests
on:
  push:
    branches: [scorpio-ng-2.0]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas==2.2.3 lxml==5.3.2 openpyxl==3.1.5 xlrd==2.0.1
      - run: python -m unittest discover -s tests -p test_falcon_import.py -v
