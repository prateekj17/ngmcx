name: FALCON MCX Vault Health
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
      BYPASS: ${{ secrets.FALCON_BYPASS_SECRET }}
    steps:
      - name: Verify Neon market vault
        run: |
          python - <<'PY'
          import os, json, urllib.request
          req=urllib.request.Request("https://ngmcx-7182-git-scorpio-ng-20-prateekj17.vercel.app/api/vault/mcx",headers={"Authorization":"Bearer "+os.environ["REFRESH_SECRET"],"x-vercel-protection-bypass":os.environ["BYPASS"]})
          with urllib.request.urlopen(req,timeout=60) as res:
              data=json.load(res)
          print(json.dumps(data,indent=2))
          assert data.get("status")=="OK", "Vault health check failed"
          PY
